<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snipers Taekwondo Club | نادي القناصون</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--gold:#ffd700;}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal;background:#000;color:#fff}

/* ===== LOADER ===== */
#loader{
position:fixed;inset:0;background:#000;
display:flex;align-items:center;justify-content:center;
z-index:9999;transition:.6s;
}
#loader h1{
color:var(--gold);
font-size:72px;
font-weight:900;
letter-spacing:6px;
animation:spinFade 2.5s ease-in-out forwards;
}
@keyframes spinFade{
0%{transform:rotate(0deg) scale(.7);opacity:0}
50%{transform:rotate(180deg) scale(1);opacity:1}
100%{transform:rotate(360deg) scale(1.1);opacity:0}
}

/* ===== HEADER ===== */
header{
display:flex;justify-content:space-between;align-items:center;
padding:15px;border-bottom:3px solid var(--gold)
}
header h1{color:var(--gold);margin:0;font-size:20px}
header button{
background:var(--gold);border:none;padding:8px 14px;
border-radius:6px;font-weight:bold;cursor:pointer
}

/* ===== HERO ===== */
.hero{
min-height:80vh;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;padding:20px
}
.hero img{
width:150px;height:150px;border-radius:50%;
box-shadow:0 0 35px var(--gold);margin-bottom:20px
}
.hero h2{color:var(--gold);font-size:36px;margin:10px 0}
.hero p{
min-height:28px;
font-size:18px;
transition:opacity .8s ease;
}
.hero .buttons{
display:flex;gap:12px;flex-wrap:wrap;justify-content:center
}
.hero a{
background:var(--gold);color:#000;padding:12px 26px;
border-radius:999px;font-weight:bold;text-decoration:none;
transition:.3s;
}
.hero a.secondary{
background:#111;color:var(--gold);
border:2px solid var(--gold)
}
.hero a:hover{transform:scale(1.05);box-shadow:0 0 20px var(--gold)}

/* ===== SECTIONS ===== */
section{
padding:30px 15px;background:#111;
opacity:0;transform:translateY(40px);
transition:.8s
}
section.show{opacity:1;transform:translateY(0)}
section.highlight{box-shadow:0 0 25px var(--gold)}

h3{text-align:center;color:var(--gold)}

/* ===== FEATURES ===== */
.features{display:grid;grid-template-columns:1fr;gap:15px}
.feature{
background:#000;padding:15px;
border-left:5px solid var(--gold);
text-align:center
}

/* ===== FORM ===== */
form{max-width:420px;margin:auto}
input,textarea,select{
width:100%;padding:12px;margin:8px 0;
background:#000;border:2px solid var(--gold);
color:#fff;font-size:15px
}
.submit{
background:var(--gold);border:none;
padding:12px;width:100%;
font-weight:bold;cursor:pointer
}
#success{
display:none;background:#0a3;
padding:12px;text-align:center;margin-top:10px;border-radius:6px
}

/* ===== WHATSAPP ===== */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25d366;color:#fff;
padding:14px;border-radius:50%;
font-size:26px;opacity:0;pointer-events:none;transition:.3s
}
.whatsapp.show{opacity:1;pointer-events:auto}
</style>
</head>

<body>

<div id="loader"><h1>SNIPERS</h1></div>

<header>
<h1 id="club">نادي القناصون للتايكواندو</h1>
<button id="langBtn">EN</button>
</header>

<div class="hero">
<img src="logo.png">
<h2 id="heroTitle">قوة • انضباط • ثقة</h2>
<p id="heroText">تدريب خاص</p>
<div class="buttons">
<a href="#register" id="heroBtn">سجل الآن</a>
<a href="#register" class="secondary" id="visitBtn">احجز زيارة</a>
</div>
</div>

<section>
<h3>لماذا القناصون؟</h3>
<div class="features">
<div class="feature">تدريب احترافي</div>
<div class="feature">لياقة عالية</div>
<div class="feature">دفاع عن النفس</div>
<div class="feature">بطولات</div>
</div>
</section>

<section id="register">
<h3>التسجيل</h3>
<form id="form">
<input placeholder="الاسم الكامل" required>
<input placeholder="رقم الهاتف" required>
<button class="submit">إرسال</button>
<div id="success">تم الاستلام</div>
</form>
</section>

<a class="whatsapp" id="whatsappBtn" href="https://wa.me/962798121015" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<script>
window.onload=()=>{
setTimeout(()=>{
const l=document.getElementById("loader");
l.style.opacity="0";
setTimeout(()=>l.remove(),600);
},1800);
};

const sections=document.querySelectorAll("section");
const whatsapp=document.getElementById("whatsappBtn");

window.addEventListener("scroll",()=>{
sections.forEach(s=>{
if(s.getBoundingClientRect().top<window.innerHeight-120){
s.classList.add("show");
}
});
whatsapp.classList.toggle("show",window.scrollY>300);
});

/* FIX MOBILE */
window.dispatchEvent(new Event('scroll'));
</script>

</body>
</html>
