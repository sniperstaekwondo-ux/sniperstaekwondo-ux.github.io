<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snipers Taekwondo Club | نادي القناصون</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--gold:#ffd700;}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal;background:#000;color:#fff}

/* ===== LOADER ===== */
#loader{
position:fixed;inset:0;background:#000;
display:flex;align-items:center;justify-content:center;
z-index:9999;transition:.6s;
}
#loader h1{
color:var(--gold);
font-size:72px;
font-weight:900;
letter-spacing:6px;
animation:spinFade 2.5s ease-in-out forwards;
}
@keyframes spinFade{
0%{transform:rotate(0deg) scale(.7);opacity:0}
50%{transform:rotate(180deg) scale(1);opacity:1}
100%{transform:rotate(360deg) scale(1.1);opacity:0}
}

/* ===== HEADER ===== */
header{
display:flex;justify-content:space-between;align-items:center;
padding:15px;border-bottom:3px solid var(--gold)
}
header h1{color:var(--gold);margin:0;font-size:20px}
header button{
background:var(--gold);border:none;padding:8px 14px;
border-radius:6px;font-weight:bold;cursor:pointer
}

/* ===== HERO ===== */
.hero{
min-height:80vh;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;padding:20px
}
.hero img{
width:150px;height:150px;border-radius:50%;
box-shadow:0 0 35px var(--gold);margin-bottom:20px
}
.hero h2{color:var(--gold);font-size:36px;margin:10px 0}
.hero p{
min-height:28px;
font-size:18px;
transition:opacity .8s ease;
text-shadow:0 0 10px rgba(255,215,0,.35),
            0 0 20px rgba(255,215,0,.2);
}

/* ===== FORM ===== */
form{max-width:420px;margin:auto}
input,textarea,select{
width:100%;padding:12px;margin:8px 0;
background:#000;border:2px solid var(--gold);
color:#fff;font-size:15px
}
.submit{
background:var(--gold);border:none;
padding:12px;width:100%;
font-weight:bold;cursor:pointer
}
#success{
display:none;background:#0a3;
padding:12px;text-align:center;
margin-top:10px;border-radius:6px
}
</style>
</head>

<body>

<div id="loader"><h1>SNIPERS</h1></div>

<header>
<h1 id="club">نادي القناصون للتايكواندو</h1>
<button id="langBtn">EN</button>
</header>

<section id="register">
<h3 id="regTitle">التسجيل</h3>

<form id="form">

<input id="nameInput" placeholder="الاسم الكامل" required>
<input id="emailInput" type="email" placeholder="البريد الإلكتروني (اختياري)">
<input id="phoneInput" placeholder="رقم الهاتف" required>
<textarea id="messageInput" placeholder="ملاحظات (العمر – موقع السكن – معلومات إضافية)"></textarea>

<label id="ratingLabel">التقييم (اختياري)</label>
<select id="ratingInput">
<option value="">اختر التقييم</option>
<option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option>
<option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option>
</select>

<button class="submit" id="sendBtn">إرسال</button>
<div id="success">تم استلام طلبك بنجاح</div>
</form>
</section>

<script>
const form=document.getElementById("form");
const success=document.getElementById("success");

const nameInput=document.getElementById("nameInput");
const emailInput=document.getElementById("emailInput");
const phoneInput=document.getElementById("phoneInput");
const messageInput=document.getElementById("messageInput");
const ratingInput=document.getElementById("ratingInput");
const langBtn=document.getElementById("langBtn");

let ar=true;

langBtn.onclick=()=>{
ar=!ar;
document.documentElement.dir=ar?"rtl":"ltr";
langBtn.innerText=ar?"EN":"AR";

nameInput.placeholder=ar?"الاسم الكامل":"Full Name";
emailInput.placeholder=ar?"البريد الإلكتروني (اختياري)":"Email (optional)";
phoneInput.placeholder=ar?"رقم الهاتف":"Phone number";
messageInput.placeholder=ar?"ملاحظات (العمر – موقع السكن – معلومات إضافية)":"Notes (age – area – extra info)";
};

form.addEventListener("submit",e=>{
e.preventDefault();

const name=nameInput.value.trim();
const phone=phoneInput.value.trim();
const email=emailInput.value.trim();
const msg=messageInput.value.trim();
const rating=ratingInput.value;

const textAR=`📥 تسجيل جديد - نادي القناصون
الاسم: ${name}
الهاتف: ${phone}
الإيميل: ${email||"غير مرفق"}
ملاحظات: ${msg||"—"}
التقييم: ${rating||"—"}`;

const textEN=`📥 New Registration - Snipers Club
Name: ${name}
Phone: ${phone}
Email: ${email||"Not provided"}
Notes: ${msg||"—"}
Rating: ${rating||"—"}`;

window.open(
`https://wa.me/962798121015?text=${encodeURIComponent(ar?textAR:textEN)}`,
"_blank"
);

const welcomeAR="👋 أهلاً بك في نادي القناصون، تم استلام طلبك وسنتواصل معك قريبًا 🥋✨";
const welcomeEN="👋 Welcome to Snipers Taekwondo Club! We received your request and will contact you soon 🥋✨";

setTimeout(()=>{
window.open(
`https://wa.me/${phone}?text=${encodeURIComponent(ar?welcomeAR:welcomeEN)}`,
"_blank"
);
},800);

success.style.display="block";
form.reset();
});
</script>

</body>
</html>
